[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "get-files-teacher-aint-providing"
version = "2026.10.28"
dependencies = []
description = "get files that teacher ain't providing"
readme = "README.md"


[project.optional-dependencies]
pytest = ["pytest"]
all = ["pytest"]

[project.scripts]
extract-files = "extract_files/extract:__cli "

[tool.setuptools.package.find]
where = ["src"]